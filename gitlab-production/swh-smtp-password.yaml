---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: swh-smtp-password-vss
  namespace: gitlab-system
spec:
  destination:
    create: true
    name: swh-smtp-password
    overwrite: true
  mount: secrets-gitlab-production
  path: swh-smtp-password
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
