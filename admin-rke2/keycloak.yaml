---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  namespace: keycloak
  name: keycloak
spec:
  instances: 2
  update:
    strategy: Auto
  db:
    vendor: postgres
    host: db-keycloak-rw
    usernameSecret:
      name: swh-keycloak-postgres-secret
      key: username
    passwordSecret:
      name: swh-keycloak-postgres-secret
      key: password
    database: keycloak
  features:
    enabled:
      - client-admin-api:v2
  http:
    httpEnabled: true
  hostname:
    hostname: http://keycloak.internal.admin.swh.network
    # strict: false
    # backchannelDynamic: true
  # Ingress does not allow to declare multipe ingress hostname
  # So our configuration with reverse-proxy won't be functional for now
  # (for test purposes)
  ingress:
    enabled: false
    className: nginx
  # proxy:
  #   headers: xforwarded
  # additionalOptions:
  #   - name: log-console-output
  #     value: json
  #   - name: metrics-enabled
  #     value: 'true'
  # -#  name: event-metrics-user-enabled
  #  #  value: 'true'

---
# Source: cluster-config/templates/keycloak/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: keycloak
spec:
  ingressClassName: "nginx"
  rules:
    - host: "keycloak.internal.admin.swh.network"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  name: http
            pathType: ImplementationSpecific
    - host: "auth.softwareheritage.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  name: http
            pathType: ImplementationSpecific
