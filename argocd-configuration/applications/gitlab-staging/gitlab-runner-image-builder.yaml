---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-staging-gitlab-runner-image-builder
  namespace: argocd
spec:
  project: default
  destination:
    server: https://192.168.200.13
    namespace: gitlab-runner
  sources:
    - chart: gitlab-runner
      repoURL: https://charts.gitlab.io
      targetRevision: 0.93.0
      helm:
        releaseName: gitlab-runner-image-builder
        valueFiles:
          - $values/argocd-configuration/applications/gitlab-staging/values/gitlab-runner-image-builder.yaml
    - repoURL: https://gitlab.softwareheritage.org/swh/infra/ci-cd/k8s-clusters-conf.git
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
