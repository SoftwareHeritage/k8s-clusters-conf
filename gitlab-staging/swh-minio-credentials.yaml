---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: swh-minio-credentials-vss
  namespace: gitlab-system
spec:
  destination:
    create: true
    name: swh-minio-credentials
    overwrite: true
  mount: secrets-gitlab-staging
  path: swh-minio-credentials
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
