---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgbouncer-userlist-secret-vss
  namespace: cnpg
spec:
  destination:
    create: true
    name: pgbouncer-userlist-secret
    overwrite: true
  mount: secrets-test-staging-rke2
  path: pgbouncer-userlist-secret
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
