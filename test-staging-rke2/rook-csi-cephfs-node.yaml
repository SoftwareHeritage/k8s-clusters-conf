---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rook-csi-cephfs-node-vss
  namespace: rook-ceph
spec:
  destination:
    create: true
    name: rook-csi-cephfs-node
    overwrite: true
    type: kubernetes.io/rook
  mount: secrets-test-staging-rke2
  path: rook-csi-cephfs-node
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
